<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- counter-v24 -->
  <title>Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'DM Sans', sans-serif; background: #0f0f0f; color: #f0f0f0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; touch-action: manipulation; }

    /* Header */
    .hdr { background: #0a0a0a; border-bottom: 1px solid #1e1e1e; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; flex-shrink: 0; }
    .logo-img { height: 26px; width: auto; display: block; }
    .hdr-right { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; margin-left: 10px; }
    .hdr-date { font-size: 11px; color: #444; font-family: 'DM Mono', monospace; }

    /* Chart section */
    .chart-section { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px 8px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
    .chart-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #444; }
    .legend { display: flex; gap: 12px; }
    .leg-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #666; }
    .leg-dot { width: 8px; height: 8px; border-radius: 2px; }

    /* Funnel leaderboard (Doors -> Convos -> Sales stacked per rep) */
    .chart-area { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 13px; padding: 4px 0; overflow: hidden; }
    .rep-block { display: flex; align-items: center; gap: 10px; }
    .rep-block.me .rep-label .nm { color: #fff; font-weight: 800; font-size: 13px; }
    .rep-label { width: 58px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; line-height: 1.1; overflow: hidden; }
    .rep-label .nm { font-size: 12px; font-weight: 700; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .rep-label .ts { font-size: 9px; font-family: 'DM Mono', monospace; color: #555; white-space: nowrap; margin-top: 1px; }
    .rep-bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .stack-row { display: flex; align-items: center; }
    .stack-bar { height: 15px; border-radius: 4px; display: flex; align-items: center; justify-content: center; padding: 0 3px; box-sizing: border-box; min-width: 14px; flex-shrink: 0; overflow: hidden; transition: width 0.3s ease; }
    .stack-num { font-size: 10px; font-weight: 700; font-family: 'DM Mono', monospace; color: #141414; }
    .sb-doors  { background: #F5A31A; }
    .sb-convos { background: #60a5fa; }
    .sb-sales  { background: #4ade80; }
    .stack-pct { font-size: 9px; font-family: 'DM Mono', monospace; color: #f0f0f0; margin-left: 6px; white-space: nowrap; flex-shrink: 0; }
    .no-data { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #333; }

    /* Divider */
    .divider { height: 1px; background: #1e1e1e; flex-shrink: 0; position: relative; margin: 0 0 4px; }
    .divider span { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #0f0f0f; padding: 0 10px; font-size: 10px; color: #444; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }

    /* Stacked counters */
    .cnt-section { flex-shrink: 0; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 9px; }
    .cnt-row { display: flex; align-items: center; gap: 14px; height: 74px; padding: 0 16px; border-radius: 16px; background: #1a1a1a; border: 1px solid #2a2a2a; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; transition: transform 0.06s ease, background 0.06s ease, border-color 0.06s ease; touch-action: manipulation; }
    .cnt-row:active { transform: scale(0.98); }
    .cnt-doors:active   { background: #241c0c; border-color: #F5A31A; }
    .cnt-engaged:active { background: #0f1a2e; border-color: #60a5fa; }
    .cnt-sales:active   { background: #0f2418; border-color: #4ade80; }
    /* JS-driven press animation (reliable on iOS, unlike :active) */
    .cnt-doors.tapped   { animation: tapDoors 0.18s ease; }
    .cnt-engaged.tapped { animation: tapEng   0.18s ease; }
    .cnt-sales.tapped   { animation: tapSale  0.18s ease; }
    @keyframes tapDoors { 0% { transform: scale(1); background:#1a1a1a; border-color:#2a2a2a; } 35% { transform: scale(0.96); background:#241c0c; border-color:#F5A31A; } 100% { transform: scale(1); background:#1a1a1a; border-color:#2a2a2a; } }
    @keyframes tapEng   { 0% { transform: scale(1); background:#1a1a1a; border-color:#2a2a2a; } 35% { transform: scale(0.96); background:#0f1a2e; border-color:#60a5fa; } 100% { transform: scale(1); background:#1a1a1a; border-color:#2a2a2a; } }
    @keyframes tapSale  { 0% { transform: scale(1); background:#1a1a1a; border-color:#2a2a2a; } 35% { transform: scale(0.96); background:#0f2418; border-color:#4ade80; } 100% { transform: scale(1); background:#1a1a1a; border-color:#2a2a2a; } }
    .cnt-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
    .cnt-doors   .cnt-dot { background: #F5A31A; }
    .cnt-engaged .cnt-dot { background: #60a5fa; }
    .cnt-sales   .cnt-dot { background: #4ade80; }
    .cnt-lbl { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #888; }
    .cnt-num { margin-left: auto; font-size: 42px; font-weight: 700; font-family: 'DM Mono', monospace; line-height: 1; }
    .cnt-doors   .cnt-num { color: #F5A31A; }
    .cnt-engaged .cnt-num { color: #60a5fa; }
    .cnt-sales   .cnt-num { color: #4ade80; }
    .cnt-num.pop { animation: popNum 0.18s ease; }
    @keyframes popNum { 0% { transform: scale(1); } 40% { transform: scale(1.24); } 100% { transform: scale(1); } }
    .cnt-sub { flex-shrink: 0; width: 44px; height: 44px; border: 1px solid #2a2a2a; background: #141414; border-radius: 12px; color: #666; font-size: 22px; cursor: pointer; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center; transition: transform 0.06s ease, background 0.06s ease; touch-action: manipulation; }
    .cnt-sub:active { color: #ccc; background: #222; transform: scale(0.88); }

    .status { text-align: center; font-size: 10px; color: #333; font-family: 'DM Mono', monospace; margin-top: 4px; }
    .status.ok  { color: #4ade80; }
    .status.err { color: #ef4444; }

    /* Promo codes (inline in header, muted gray like counter buttons) */
    .promo-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #999; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; padding: 5px 7px; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .promo-btn:active { background: #2a2a2a; color: #ccc; }
    /* 20 & 30 = clear choices: wider + brighter */
    #promo20, #promo30 { flex: 1; padding: 6px 16px; color: #cfcfcf; }
    /* 40 = de-emphasized */
    #promo40 { padding: 4px 7px; font-size: 9px; color: #5a5a5a; border-color: #232323; }

    /* 40-off warning */
    .overlay40 { position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 800; display: none; align-items: center; justify-content: center; padding: 24px; }
    .overlay40.open { display: flex; }
    .warn-box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 22px 20px; width: 300px; max-width: 100%; text-align: center; }
    .warn-title { font-size: 14px; font-weight: 700; color: #f0f0f0; margin-bottom: 8px; }
    .warn-text { font-size: 12px; color: #999; line-height: 1.6; margin-bottom: 18px; }
    .warn-confirm { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #F5A31A; color: #241900; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; touch-action: manipulation; }
    .warn-cancel { display: block; margin-top: 12px; font-size: 12px; color: #666; cursor: pointer; }

    /* Toast */
    .toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(20px); background: #fff; color: #111; padding: 9px 18px; border-radius: 9px; font-size: 13px; font-weight: 600; z-index: 900; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body ontouchstart="">

<div class="hdr">
  <img class="logo-img" src="/motion-logo-nobackground.png" alt="Motion">
  <div class="hdr-right">
    <button class="promo-btn" id="promo20">20 OFF</button>
    <button class="promo-btn" id="promo30">30 OFF</button>
    <button class="promo-btn" id="promo40">40 OFF</button>
    <span class="hdr-date" id="hdr-date"></span>
  </div>
</div>

<div class="chart-section">
  <div class="chart-header">
    <div class="chart-title">Today's Team</div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:#F5A31A"></div>Doors</div>
      <div class="leg-item"><div class="leg-dot" style="background:#60a5fa"></div>Convos</div>
      <div class="leg-item"><div class="leg-dot" style="background:#4ade80"></div>Sales</div>
    </div>
  </div>
  <div id="chart-area" class="chart-area">
    <div class="no-data">No data yet today</div>
  </div>
</div>

<div class="divider"><span id="my-label">My Counter</span></div>

<div class="cnt-section">
  <div class="cnt-row cnt-sales" id="row-sales">
    <button class="cnt-sub" id="sub-sales">&minus;</button>
    <div class="cnt-dot"></div>
    <div class="cnt-lbl">Sales</div>
    <div class="cnt-num" id="cnt-sales">0</div>
  </div>
  <div class="cnt-row cnt-engaged" id="row-engaged">
    <button class="cnt-sub" id="sub-engaged">&minus;</button>
    <div class="cnt-dot"></div>
    <div class="cnt-lbl">Convos</div>
    <div class="cnt-num" id="cnt-engaged">0</div>
  </div>
  <div class="cnt-row cnt-doors" id="row-doors">
    <button class="cnt-sub" id="sub-doors">&minus;</button>
    <div class="cnt-dot"></div>
    <div class="cnt-lbl">Doors</div>
    <div class="cnt-num" id="cnt-doors">0</div>
  </div>
  <div class="status" id="status">connecting&hellip;</div>
</div>

<div class="overlay40" id="overlay40">
  <div class="warn-box">
    <div class="warn-title">&#128680; Heads up &#128680;</div>
    <p class="warn-text">This code is ONLY for rare fixed-wireless price-match situations on 1000MBPS &amp; 500MBPS.</p>
    <button class="warn-confirm" id="confirm40" style="display:none;">Got it &mdash; Copy Code</button>
    <span class="warn-cancel" id="cancel40">Cancel</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
var REPS   = { logan:'Logan McLean', brycen:'Brycen Perkins', sami:'Sami Layadi', connor:'Connor McLean', jacob:'Jacob Denver' };
var ORDER  = ['logan','brycen','sami','connor','jacob'];
var MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var FULL_UNITS = 50; // total across all segments that fills the bar to full width
var MIN_SEG    = 32; // min px per segment so its number always shows

var parts = window.location.pathname.split('/').filter(Boolean);
var slug  = (parts[1] || 'logan').toLowerCase();
if (!REPS[slug]) slug = 'logan';
var repFirst = REPS[slug].split(' ')[0];

document.getElementById('my-label').textContent  = repFirst + "'s Counter";
var now = new Date();
document.getElementById('hdr-date').textContent   = DN[now.getDay()] + ' ' + MN[now.getMonth()] + ' ' + now.getDate();

/* ── Feedback: haptic + number pop (no sound) ────────────── */
function haptic(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }
function popNum(field) {
  var el = document.getElementById('cnt-' + field);
  if (!el) return;
  el.classList.remove('pop');
  void el.offsetWidth; // reflow so the animation restarts on rapid taps
  el.classList.add('pop');
}
function pressRow(field) {
  var el = document.getElementById('row-' + field);
  if (!el) return;
  el.classList.remove('tapped');
  void el.offsetWidth; // reflow so the animation restarts on rapid taps
  el.classList.add('tapped');
}

firebase.initializeApp({
  apiKey:            "AIzaSyA8swfoYsvJsU0ugfxFmJTs2almBk7DGVE",
  authDomain:        "motion-marketing-e1e45.firebaseapp.com",
  databaseURL:       "https://motion-marketing-e1e45-default-rtdb.firebaseio.com",
  projectId:         "motion-marketing-e1e45",
  storageBucket:     "motion-marketing-e1e45.firebasestorage.app",
  messagingSenderId: "356161676852",
  appId:             "1:356161676852:web:d5591aad4c99f06a088c61"
});
var db = firebase.database();

var _local = { doors:0, engaged:0, sales:0 };
var _data  = {};

function todayKey() {
  var d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n) { return n < 10 ? '0'+n : ''+n; }

db.ref('counters/'+todayKey()).on('value', function(snap) {
  _data = snap.val() || {};
  var mine = _data[slug] || {};
  _local.doors   = mine.doors   || 0;
  _local.engaged = mine.engaged || 0;
  _local.sales   = mine.sales   || 0;
  updateMyDisplay();
  renderChart();
  document.getElementById('status').textContent = '\u25CF live';
  document.getElementById('status').className = 'status ok';
}, function() {
  document.getElementById('status').textContent = '\u25CF offline';
  document.getElementById('status').className = 'status err';
});

function increment(field) {
  _local[field] = (_local[field]||0) + 1;
  updateMyDisplay();
  popNum(field);
  pressRow(field);
  haptic(14);
  db.ref('counters/'+todayKey()+'/'+slug).transaction(function(d) {
    if (!d) d = { doors:0, engaged:0, sales:0, firstDoor:null };
    d[field] = (d[field]||0) + 1;
    if (field === 'doors' && d.doors === 1) d.firstDoor = Date.now(); // fresh stamp each 0->1
    return d;
  });
}

function decrement(field) {
  _local[field] = Math.max(0, (_local[field]||0) - 1);
  updateMyDisplay();
  popNum(field);
  pressRow(field);
  haptic(8);
  db.ref('counters/'+todayKey()+'/'+slug).transaction(function(d) {
    if (!d) return d;
    d[field] = Math.max(0, (d[field]||0) - 1);
    if (field === 'doors' && d.doors === 0) d.firstDoor = null; // clear stamp at zero
    return d;
  });
}

function updateMyDisplay() {
  document.getElementById('cnt-doors').textContent   = _local.doors;
  document.getElementById('cnt-engaged').textContent = _local.engaged;
  document.getElementById('cnt-sales').textContent   = _local.sales;
}

function fmtTime(ms) {
  if (!ms) return '';
  // Always render in Central Time, regardless of the rep's device timezone
  var parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hour12: true
  }).formatToParts(new Date(ms));
  var o = {};
  parts.forEach(function(p) { o[p.type] = p.value; });
  var ap = (o.dayPeriod || '').toLowerCase().charAt(0); // 'a' or 'p'
  return o.hour + ':' + o.minute + ap;
}

function renderChart() {
  var area = document.getElementById('chart-area');
  var active = ORDER.filter(function(s) {
    var d = _data[s] || {};
    return (d.doors||0) + (d.engaged||0) + (d.sales||0) > 0;
  });

  if (!active.length) {
    area.innerHTML = '<div class="no-data">No data yet today</div>';
    return;
  }

  // Sort by doors, descending
  active.sort(function(a,b){ return ((_data[b]||{}).doors||0) - ((_data[a]||{}).doors||0); });

  // All three bars share ONE scale: full width at FULL_UNITS, capped after that
  function barW(n) { return Math.min(100, n / FULL_UNITS * 100); }

  area.innerHTML = active.map(function(s) {
    var d      = _data[s] || { doors:0, engaged:0, sales:0 };
    var first  = REPS[s].split(' ')[0];
    var isMe   = s === slug;
    var doors  = d.doors   || 0;
    var convos = d.engaged || 0;
    var sales  = d.sales   || 0;
    // Step-down conversion rates (what % carried to the next stage)
    var convPct = doors  > 0 ? Math.round(convos / doors  * 100) : null; // convos per door
    var salePct = convos > 0 ? Math.round(sales  / convos * 100) : null; // sales per convo

    function bar(cls, count, pct) {
      return '<div class="stack-row">'
        + '<div class="stack-bar ' + cls + '" style="width:' + barW(count) + '%"><span class="stack-num">' + count + '</span></div>'
        + (pct !== null ? '<span class="stack-pct">' + pct + '%</span>' : '')
      + '</div>';
    }

    // Only show a bar once it has at least 1
    var rows = '';
    if (sales  > 0) rows += bar('sb-sales',  sales,  salePct);
    if (convos > 0) rows += bar('sb-convos', convos, convPct);
    if (doors  > 0) rows += bar('sb-doors',  doors,  null);

    var ts = d.firstDoor ? '<span class="ts">' + fmtTime(d.firstDoor) + '</span>' : '';

    return '<div class="rep-block' + (isMe ? ' me' : '') + '">'
      + '<div class="rep-label"><span class="nm">' + first + '</span>' + ts + '</div>'
      + '<div class="rep-bars">' + rows + '</div>'
    + '</div>';
  }).join('');
}

/* ── One clean action per tap (prevents iOS ghost-click double-fire) ── */
function bindTap(el, fn, stop) {
  if (!el) return;
  var last = 0;
  el.addEventListener('touchend', function(e) { if (stop) e.stopPropagation(); e.preventDefault(); last = Date.now(); fn(); }, { passive: false });
  el.addEventListener('click', function(e) { if (stop) e.stopPropagation(); if (Date.now() - last < 700) return; fn(); });
}
['doors','engaged','sales'].forEach(function(fld) {
  bindTap(document.getElementById('row-' + fld), function() { increment(fld); });
  bindTap(document.getElementById('sub-' + fld), function() { decrement(fld); }, true);
});

/* ── Promo codes ─────────────────────────────────────────── */
var CODES = { '20': 'BORRJWUI', '30': 'FBWXFIIO', '40': 'XLSCAQPQ' };
var _toastT;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(function() { t.classList.remove('show'); }, 2200);
}
function copyCode(code) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(function() { toast('Copied: ' + code); }).catch(function() { fallbackCopy(code); });
  } else { fallbackCopy(code); }
}
function fallbackCopy(code) {
  var ta = document.createElement('textarea');
  ta.value = code; ta.style.cssText = 'position:absolute;left:-9999px;top:0;';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta); toast('Copied: ' + code);
}
function open40() {
  var btn = document.getElementById('confirm40');
  btn.style.display = 'none';
  document.getElementById('overlay40').classList.add('open');
  setTimeout(function() { btn.style.display = ''; }, 3000);
}
function close40() { document.getElementById('overlay40').classList.remove('open'); }

bindTap(document.getElementById('promo20'), function() { copyCode(CODES['20']); });
bindTap(document.getElementById('promo30'), function() { copyCode(CODES['30']); });
bindTap(document.getElementById('promo40'), open40);
bindTap(document.getElementById('confirm40'), function() { close40(); copyCode(CODES['40']); });
bindTap(document.getElementById('cancel40'), close40);
document.getElementById('overlay40').addEventListener('click', function(e) { if (e.target === this) close40(); });
</script>
</body>
</html>
