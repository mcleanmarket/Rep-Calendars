<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- counter-v3 -->
  <title>Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'DM Sans', sans-serif; background: #0f0f0f; color: #f0f0f0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* Header */
    .hdr { background: #0a0a0a; border-bottom: 1px solid #1e1e1e; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
    .hdr-left { display: flex; align-items: center; gap: 8px; }
    .logo-circle { width: 28px; height: 28px; background: #F5A31A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; }
    .logo-text { font-size: 17px; font-weight: 700; color: #fff; }
    .logo-text span { color: #F5A31A; }
    .hdr-right { display: flex; align-items: center; gap: 10px; }
    .hdr-date { font-size: 11px; color: #444; font-family: 'DM Mono', monospace; }
    .back-btn { font-size: 11px; color: #555; background: none; border: 1px solid #2a2a2a; padding: 4px 9px; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; text-decoration: none; }

    /* Chart section */
    .chart-section { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 8px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
    .chart-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #444; }
    .legend { display: flex; gap: 12px; }
    .leg-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #666; }
    .leg-dot { width: 8px; height: 8px; border-radius: 2px; }

    /* The actual chart */
    .chart-area { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 16px; justify-content: center; padding-bottom: 4px; }
    .rep-group { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; max-width: 80px; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 100%; width: 100%; justify-content: center; }
    .bar-wrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1; height: 100%; }
    .bar { width: 100%; border-radius: 3px 3px 0 0; transition: height 0.4s ease; position: relative; min-height: 0; }
    .bar.doors   { background: #F5A31A; }
    .bar.engaged { background: #3b82f6; }
    .bar.sales   { background: #4ade80; }
    .bar-num { font-size: 9px; font-family: 'DM Mono', monospace; color: #888; text-align: center; margin-bottom: 2px; height: 12px; line-height: 12px; }
    .rep-name { font-size: 11px; font-weight: 700; color: #888; text-align: center; white-space: nowrap; }
    .rep-name.me { color: #F5A31A; }
    .rep-first { font-size: 9px; color: #444; font-family: 'DM Mono', monospace; text-align: center; margin-top: 1px; }

    .no-data { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #333; }

    /* Divider */
    .divider { height: 1px; background: #1e1e1e; flex-shrink: 0; position: relative; }
    .divider span { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #0f0f0f; padding: 0 10px; font-size: 10px; color: #444; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }

    /* Counters */
    .cnt-section { flex-shrink: 0; padding: 14px 14px 22px; }
    .counters { display: flex; gap: 8px; margin-bottom: 10px; }
    .cnt-card { flex: 1; border-radius: 14px; background: #1a1a1a; border: 1px solid #2a2a2a; overflow: hidden; display: flex; flex-direction: column; }
    .cnt-tap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 8px 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
    .cnt-tap:active { background: #222; }
    .cnt-num { font-size: 48px; font-weight: 700; font-family: 'DM Mono', monospace; line-height: 1; }
    .cnt-doors   .cnt-num { color: #F5A31A; }
    .cnt-engaged .cnt-num { color: #3b82f6; }
    .cnt-sales   .cnt-num { color: #4ade80; }
    .cnt-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #555; margin-top: 5px; }
    .cnt-sub { width: 100%; border: none; border-top: 1px solid #222; background: #141414; color: #444; font-size: 18px; padding: 6px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .cnt-sub:active { color: #aaa; }

    .reset-row { display: flex; gap: 8px; align-items: center; }
    .reset-btn { flex: 1; padding: 8px; background: transparent; border: 1px solid #2a2a2a; border-radius: 8px; color: #444; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
    .reset-btn:active { color: #888; border-color: #555; }
    .status { font-size: 10px; color: #333; font-family: 'DM Mono', monospace; flex-shrink: 0; }
    .status.ok  { color: #4ade80; }
    .status.err { color: #ef4444; }

    /* Confirm */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 900; display: none; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .confirm-box { background: #1a1a1a; border: 1px solid #333; border-radius: 14px; padding: 24px 20px; width: 260px; text-align: center; }
    .confirm-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .confirm-box p { font-size: 12px; color: #666; margin-bottom: 20px; }
    .confirm-btns { display: flex; gap: 8px; }
    .cbtn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .cbtn-cancel { background: #2a2a2a; color: #aaa; }
    .cbtn-go     { background: #ef4444; color: #fff; }
  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="logo-circle">N</div>
    <div class="logo-text"><span>NEXT</span>LINK</div>
  </div>
  <div class="hdr-right">
    <span class="hdr-date" id="hdr-date"></span>
    <a class="back-btn" id="back-link">← Back</a>
  </div>
</div>

<div class="chart-section">
  <div class="chart-header">
    <div class="chart-title">Today's Team</div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:#F5A31A"></div>Doors</div>
      <div class="leg-item"><div class="leg-dot" style="background:#3b82f6"></div>Engaged</div>
      <div class="leg-item"><div class="leg-dot" style="background:#4ade80"></div>Sales</div>
    </div>
  </div>
  <div id="chart-area" class="chart-area">
    <div class="no-data">No data yet today</div>
  </div>
</div>

<div class="divider"><span id="my-label">My Counter</span></div>

<div class="cnt-section">
  <div class="counters">
    <div class="cnt-card cnt-doors">
      <div class="cnt-tap" onclick="increment('doors')">
        <div class="cnt-num" id="cnt-doors">0</div>
        <div class="cnt-lbl">Doors</div>
      </div>
      <button class="cnt-sub" onclick="decrement('doors')">−</button>
    </div>
    <div class="cnt-card cnt-engaged">
      <div class="cnt-tap" onclick="increment('engaged')">
        <div class="cnt-num" id="cnt-engaged">0</div>
        <div class="cnt-lbl">Engaged</div>
      </div>
      <button class="cnt-sub" onclick="decrement('engaged')">−</button>
    </div>
    <div class="cnt-card cnt-sales">
      <div class="cnt-tap" onclick="increment('sales')">
        <div class="cnt-num" id="cnt-sales">0</div>
        <div class="cnt-lbl">Sales</div>
      </div>
      <button class="cnt-sub" onclick="decrement('sales')">−</button>
    </div>
  </div>
  <div class="reset-row">
    <button class="reset-btn" onclick="openReset()">Reset Mine</button>
    <span class="status" id="status">connecting…</span>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Reset counters?</h3>
    <p>Zeros out your Doors, Engaged, and Sales for today.</p>
    <div class="confirm-btns">
      <button class="cbtn cbtn-cancel" onclick="closeReset()">Cancel</button>
      <button class="cbtn cbtn-go"     onclick="confirmReset()">Reset</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
var REPS   = { logan:'Logan McLean', brycen:'Brycen Perkins', sami:'Sami Layadi', connor:'Connor McLean', jacob:'Jacob Denver' };
var COLORS = { logan:'#F5A31A', brycen:'#60a5fa', sami:'#34d399', connor:'#c084fc', jacob:'#f87171' };
var ORDER  = ['logan','brycen','sami','connor','jacob'];
var MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

var parts = window.location.pathname.split('/').filter(Boolean);
var slug  = (parts[1] || 'logan').toLowerCase();
if (!REPS[slug]) slug = 'logan';
var repFirst = REPS[slug].split(' ')[0];

document.getElementById('my-label').textContent  = repFirst + "'s Counter";
document.getElementById('back-link').href         = '/' + slug;
var now = new Date();
document.getElementById('hdr-date').textContent   = DN[now.getDay()] + ' ' + MN[now.getMonth()] + ' ' + now.getDate();

firebase.initializeApp({
  apiKey:            "AIzaSyA8swfoYsvJsU0ugfxFmJTs2almBk7DGVE",
  authDomain:        "motion-marketing-e1e45.firebaseapp.com",
  databaseURL:       "https://motion-marketing-e1e45-default-rtdb.firebaseio.com",
  projectId:         "motion-marketing-e1e45",
  storageBucket:     "motion-marketing-e1e45.firebasestorage.app",
  messagingSenderId: "356161676852",
  appId:             "1:356161676852:web:d5591aad4c99f06a088c61"
});
var db = firebase.database();

var _local = { doors:0, engaged:0, sales:0 };
var _data  = {};

function todayKey() {
  var d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n) { return n < 10 ? '0'+n : ''+n; }

db.ref('counters/'+todayKey()).on('value', function(snap) {
  _data = snap.val() || {};
  var mine = _data[slug] || {};
  _local.doors   = mine.doors   || 0;
  _local.engaged = mine.engaged || 0;
  _local.sales   = mine.sales   || 0;
  updateMyDisplay();
  renderChart();
  document.getElementById('status').textContent   = '● live';
  document.getElementById('status').className = 'status ok';
}, function() {
  document.getElementById('status').textContent   = '● offline';
  document.getElementById('status').className = 'status err';
});

function increment(field) {
  _local[field] = (_local[field]||0) + 1;
  updateMyDisplay();
  db.ref('counters/'+todayKey()+'/'+slug).transaction(function(d) {
    if (!d) d = { doors:0, engaged:0, sales:0, firstDoor:null };
    d[field] = (d[field]||0) + 1;
    if (field === 'doors' && !d.firstDoor) d.firstDoor = Date.now();
    return d;
  });
}

function decrement(field) {
  _local[field] = Math.max(0, (_local[field]||0) - 1);
  updateMyDisplay();
  db.ref('counters/'+todayKey()+'/'+slug).transaction(function(d) {
    if (!d) return d;
    d[field] = Math.max(0, (d[field]||0) - 1);
    return d;
  });
}

function updateMyDisplay() {
  document.getElementById('cnt-doors').textContent   = _local.doors;
  document.getElementById('cnt-engaged').textContent = _local.engaged;
  document.getElementById('cnt-sales').textContent   = _local.sales;
}

function renderChart() {
  var area = document.getElementById('chart-area');
  // Only show reps with at least 1 tap
  var active = ORDER.filter(function(s) {
    var d = _data[s] || {};
    return (d.doors||0) + (d.engaged||0) + (d.sales||0) > 0;
  });

  if (!active.length) {
    area.innerHTML = '<div class="no-data">No data yet today</div>';
    return;
  }

  // Max value for scaling
  var maxVal = 1;
  active.forEach(function(s) {
    var d = _data[s] || {};
    maxVal = Math.max(maxVal, d.doors||0, d.engaged||0, d.sales||0);
  });

  // Chart height available (get from DOM)
  var chartH = area.clientHeight || 160;
  var maxBarH = Math.max(chartH - 32, 60); // leave room for name + number labels

  area.innerHTML = active.map(function(s) {
    var d = _data[s] || { doors:0, engaged:0, sales:0 };
    var first = REPS[s].split(' ')[0];
    var isMe  = s === slug;

    function barHTML(val, cls) {
      var h = Math.round((val / maxVal) * maxBarH);
      return '<div class="bar-wrap">'
        + '<div class="bar-num">' + (val > 0 ? val : '') + '</div>'
        + '<div class="bar ' + cls + '" style="height:' + h + 'px"></div>'
        + '</div>';
    }

    return '<div class="rep-group">'
      + '<div class="bars" style="height:' + maxBarH + 'px">'
        + barHTML(d.doors||0,   'doors')
        + barHTML(d.engaged||0, 'engaged')
        + barHTML(d.sales||0,   'sales')
      + '</div>'
      + '<div class="rep-name' + (isMe ? ' me' : '') + '">' + first + '</div>'
    + '</div>';
  }).join('');
}

function openReset()  { document.getElementById('confirmOverlay').classList.add('open'); }
function closeReset() { document.getElementById('confirmOverlay').classList.remove('open'); }
function confirmReset() {
  closeReset();
  _local = { doors:0, engaged:0, sales:0 };
  updateMyDisplay();
  db.ref('counters/'+todayKey()+'/'+slug).set({ doors:0, engaged:0, sales:0, firstDoor:null });
}
</script>
</body>
</html>
