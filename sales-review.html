<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- sales-review-v18 -->
<title>Sales Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:#0f0f0f;color:#f0f0f0;min-height:100vh;padding-bottom:60px}
  .hdr{background:#0a0a0a;border-bottom:1px solid #1e1e1e;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10}
  .hdr h1{font-size:15px;font-weight:800}
  .hdr-controls{display:flex;gap:8px;align-items:center}
  input[type=date]{background:#1a1a1a;border:1px solid #2a2a2a;color:#f0f0f0;border-radius:8px;padding:8px 10px;font-family:'DM Mono',monospace;font-size:13px}
  .btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#e6e6e6;font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif}
  .btn:active{background:#2a2a2a}
  .btn.primary{background:#4ade80;color:#0a2412;border-color:#4ade80}
  .wrap{padding:16px}
  .empty{text-align:center;color:#444;font-size:13px;padding:60px 20px}
  .rep-group{margin-bottom:22px}
  .rep-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .rep-hd .nm{font-size:14px;font-weight:800}
  .rep-hd .ct{font-size:11px;color:#666;font-family:'DM Mono',monospace}
  .item{background:#161616;border:1px solid #262626;border-radius:12px;padding:12px;margin-bottom:8px}
  .item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .item-time{font-size:11.5px;color:#888;font-family:'DM Mono',monospace}
  .item-time b{color:#fff;font-family:'DM Sans',sans-serif;font-weight:800}
  .total-counter{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;padding:0 2px}
  .total-counter .num{font-size:34px;font-weight:800;color:#4ade80;font-family:'DM Mono',monospace;line-height:1}
  .total-counter .lbl{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .thumb{width:100%;max-width:260px;border-radius:8px;border:1px solid #2a2a2a;display:block;margin-bottom:8px;cursor:pointer}
  .txt-block{background:#0e0e0e;border:1px solid #232323;border-radius:8px;padding:10px;font-size:12.5px;line-height:1.5;color:#ccc;white-space:pre-wrap;max-height:160px;overflow-y:auto;margin-bottom:8px}
  .item-actions{display:flex;gap:8px}
  .notes-block{font-size:12px;color:#999;font-style:italic;padding:8px 10px;border-left:2px solid #333;margin-bottom:8px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:9px 18px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:900}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=password]{background:#1a1a1a;border:1px solid #2a2a2a;color:#f0f0f0;border-radius:8px;padding:8px 10px;font-family:'DM Mono',monospace;font-size:13px;width:180px}
  .process-panel{background:#161616;border:1px solid #262626;border-radius:12px;padding:14px;margin-bottom:22px}
  .process-status{font-size:12.5px;color:#999;margin-top:10px;min-height:16px}
  .process-status.err{color:#ef4444}
  .results-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:12px}
  .results-table th{background:#0e0e0e;color:#888;text-align:left;padding:7px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:9.5px;border-bottom:1px solid #262626;white-space:nowrap}
  .results-table td{padding:7px 8px;border-bottom:1px solid #1e1e1e;color:#ddd;white-space:nowrap}
  .results-table tr td.flag{color:#f5a31a}
  .results-scroll{overflow-x:auto}
  .status-Scheduled{color:#4ade80}
  .status-Pending{color:#f5a31a}
  .btn.danger{background:#2e0e0e;border-color:#5a1a1a;color:#f87171}
  .btn.danger:active{background:#3a1212}
  .synced-panel{background:#0f1a12;border:1px solid #1f3a26;border-radius:12px;padding:14px;margin-bottom:22px}
  .synced-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .synced-hd h2{font-size:13px;font-weight:800;color:#e0e0e0}
  .synced-count{font-size:11.5px;color:#7fdba0;font-family:'DM Mono',monospace}
  .sync-icon{display:inline-block;width:16px;text-align:center}
  .sync-ok{color:#4ade80}
  .sync-pending{color:#666}
  .sync-fail{color:#f87171;cursor:pointer;text-decoration:underline;font-size:10px}
  .sync-alert{background:#2e0e0e;border:1px solid #7f1d1d;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;color:#fca5a5;line-height:1.5}
  .sync-alert b{color:#fff}
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:10px;">
    <img src="/motion-logo-nobackground.png" alt="Motion" style="height:26px; width:auto; display:block; cursor:pointer;" onclick="window.location.href='/counter/logan'">
    <h1>Sales Review</h1>
  </div>
  <div class="hdr-controls">
    <input type="date" id="dayPicker">
  </div>
</div>

<div class="wrap">
  <div class="synced-panel">
    <div class="synced-hd">
      <h2>Today's Processed &amp; Synced Sales</h2>
      <span class="synced-count" id="syncedCount"></span>
    </div>
    <div id="syncedWrap"><div class="empty" style="padding:20px 0;">No sales processed yet today.</div></div>
  </div>
  <div class="process-panel">
    <button class="btn" id="processDay" style="width:100%; background:#161616; color:#777; border-color:#232323; font-weight:600;">Process this day &rarr; spreadsheet rows <span style="color:#555; font-weight:500;">(rare-case cleanup only)</span></button>
    <div class="process-status" id="processStatus"></div>
    <div id="resultsWrap"></div>
  </div>
  <div class="total-counter" id="totalCounter"></div>
  <div id="content">
    <div class="empty">Loading&hellip;</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script>
var REPS = { logan:'Logan McLean', brycen:'Brycen Perkins', sami:'Sami Layadi', connor:'Connor McLean', jacob:'Jacob Denver' };
var ORDER = ['logan','brycen','sami','connor','jacob'];

firebase.initializeApp({
  apiKey:            "AIzaSyA8swfoYsvJsU0ugfxFmJTs2almBk7DGVE",
  authDomain:        "motion-marketing-e1e45.firebaseapp.com",
  databaseURL:       "https://motion-marketing-e1e45-default-rtdb.firebaseio.com",
  projectId:         "motion-marketing-e1e45",
  storageBucket:     "motion-marketing-e1e45.firebasestorage.app",
  messagingSenderId: "356161676852",
  appId:             "1:356161676852:web:d5591aad4c99f06a088c61"
});
var db = firebase.database();
var storage = firebase.storage();
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRtaW6dBF8JHdUhnTBvpLBUUC9Gedw-4jeDEkgBuKv_M_t-kojomJY61Yo9RrHQbE3/exec';
var APPEND_SECRET = 'nextlink-motion-9f2k7q'; // must match APPEND_SECRET in Code.gs and counter.html exactly

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function fmtTime(ms){
  var parts = new Intl.DateTimeFormat('en-US', {
    timeZone:'America/Chicago', hour:'numeric', minute:'2-digit', hour12:true
  }).formatToParts(new Date(ms));
  var o = {}; parts.forEach(function(p){ o[p.type]=p.value; });
  return o.hour + ':' + o.minute + (o.dayPeriod||'').toLowerCase().charAt(0);
}

var dayPicker = document.getElementById('dayPicker');
dayPicker.value = todayStr();
dayPicker.addEventListener('change', function(){ loadDay(dayPicker.value); });

var _currentData = {}; // rep -> {pushId: entry}
var _currentDay = null;
var _liveRef = null;

function loadDay(day){
  document.getElementById('content').innerHTML = '<div class="empty">Loading&hellip;</div>';
  if (_liveRef) _liveRef.off('value');
  _currentDay = day;
  _liveRef = db.ref('salesLog/' + day);
  _liveRef.on('value', function(snap){
    _currentData = snap.val() || {};
    render();
    renderSyncedPanel();
  }, function(){
    document.getElementById('content').innerHTML = '<div class="empty">Couldn\'t load that day.</div>';
  });
}

function render(){
  var wrap = document.getElementById('content');
  var totalEl = document.getElementById('totalCounter');

  var all = [];
  ORDER.forEach(function(s){
    if (!_currentData[s]) return;
    Object.keys(_currentData[s]).forEach(function(id){
      var e = _currentData[s][id]; e._id = id; e._rep = s; all.push(e);
    });
  });

  totalEl.innerHTML = '<span class="num">' + all.length + '</span><span class="lbl">Total deals submitted today</span>';

  if (!all.length){
    wrap.innerHTML = '<div class="empty">No sales logged this day.</div>';
    return;
  }

  // Most recent first \u2014 like a live feed, everyone interleaved as they come in
  all.sort(function(a,b){ return (b.ts||0) - (a.ts||0); });

  wrap.innerHTML = all.map(function(e){
    var s = e._rep;
    var time = e.ts ? fmtTime(e.ts) : '';
    var repFirst = REPS[s].split(' ')[0] + ' ' + REPS[s].split(' ')[1].charAt(0);
    var body = '';
    if (e.type === 'photo' && e.url){
      body += '<img class="thumb" src="' + e.url + '" onclick="window.open(\'' + e.url + '\',\'_blank\')">';
      if (e.text) body += '<div class="txt-block">' + escapeHtml(e.text) + '</div>';
      if (e.notes) body += '<div class="notes-block">Note: ' + escapeHtml(e.notes) + '</div>';
      body += '<div class="item-actions">'
            + '<button class="btn" onclick="copyImage(\'' + e.url + '\', this)">Copy image</button>'
            + '<button class="btn" onclick="window.open(\'' + e.url + '\',\'_blank\')">Open full size</button>'
            + '<button class="btn danger" onclick="deleteEntry(\'' + s + '\',\'' + e._id + '\')">Delete</button>'
            + '</div>';
    } else {
      body += '<div class="txt-block">' + escapeHtml(e.text || '') + '</div>';
      if (e.notes) body += '<div class="notes-block">Note: ' + escapeHtml(e.notes) + '</div>';
      body += '<div class="item-actions">'
            + '<button class="btn" onclick="copyText(this)" data-text="' + attrEscape(e.text||'') + '">Copy text</button>'
            + '<button class="btn danger" onclick="deleteEntry(\'' + s + '\',\'' + e._id + '\')">Delete</button>'
            + '</div>';
    }
    return '<div class="item"><div class="item-top"><span class="item-time">' + time + ' &mdash; <b>' + repFirst + '</b></span></div>' + body + '</div>';
  }).join('');
}

function deleteEntry(repSlug, id){
  var entry = _currentData[repSlug] && _currentData[repSlug][id];
  if (!entry) return;

  var ok = confirm('Delete this entry? This cannot be undone.');
  if (!ok) return;

  var day = dayPicker.value;

  var removeStorage = Promise.resolve();
  if (entry.type === 'photo' && entry.url){
    try {
      removeStorage = storage.refFromURL(entry.url).delete().catch(function(){ /* file may already be gone \u2014 don't block the row delete */ });
    } catch(e) { removeStorage = Promise.resolve(); }
  }

  removeStorage.then(function(){
    return db.ref('salesLog/' + day + '/' + repSlug + '/' + id).remove();
  }).then(function(){
    // Keep the Sales counter in sync with the actual logged entries
    return db.ref('counters/' + day + '/' + repSlug + '/sales').transaction(function(v){
      return Math.max(0, (v || 0) - 1);
    });
  }).then(function(){
    toast('Deleted');
    loadDay(day);
  }).catch(function(err){
    toast('Delete failed \u2014 try again');
  });
}
function renderSyncedPanel(){
  var cols = ['dateSold','repName','accId','phone','customerName','email','address','plan','price','installDate','notes','status'];
  var heads = ['','Date Sold','Rep Name','Acc ID','Phone','Customer Name','Email','Address','Plan','Price','Install Date','Notes','Status'];

  var rows = [];
  ORDER.forEach(function(s){
    if (!_currentData[s]) return;
    Object.keys(_currentData[s]).forEach(function(id){
      var e = _currentData[s][id];
      if (e.processed) rows.push({ rep: s, id: id, fields: e.processed });
    });
  });

  var countEl = document.getElementById('syncedCount');
  var wrap = document.getElementById('syncedWrap');

  if (!rows.length){
    countEl.textContent = '';
    wrap.innerHTML = '<div class="empty" style="padding:20px 0;">No sales processed yet today.</div>';
    return;
  }

  rows.sort(function(a,b){ return (a.fields.dateSold||'').localeCompare(b.fields.dateSold||''); });
  var syncedCt = rows.filter(function(r){ return r.fields.syncedToSheet === true; }).length;
  var failedRows = rows.filter(function(r){ return r.fields.syncedToSheet === false; });
  countEl.textContent = syncedCt + ' of ' + rows.length + ' synced to sheet';

  var alertHtml = '';
  if (failedRows.length){
    alertHtml = '<div class="sync-alert">'
      + '<b>\u26a0\ufe0f Sheet sync is failing.</b> ' + failedRows.length + ' sale' + (failedRows.length > 1 ? 's' : '') + ' failed after 3 automatic attempts \u2014 this usually means something\u2019s actually broken (Apps Script down, URL changed, deployment issue), not a one-off fluke. New sales will likely keep failing the same way until it\u2019s fixed. '
      + '<button class="btn" style="margin-top:8px;" onclick="resyncAllFailed()">Retry all failed</button>'
      + '</div>';
  }

  var html = alertHtml + '<div class="results-scroll"><table class="results-table"><thead><tr>'
    + heads.map(function(h){ return '<th>' + h + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function(r){
        var f = r.fields;
        var iconHtml;
        if (f.syncedToSheet === true){
          iconHtml = '<span class="sync-icon sync-ok" title="Synced to sheet">\u2713</span>';
        } else if (f.syncedToSheet === false){
          iconHtml = '<span class="sync-fail" onclick="resyncEntry(\'' + r.rep + '\',\'' + r.id + '\',this)" title="Tap to retry">retry</span>';
        } else {
          iconHtml = '<span class="sync-icon sync-pending" title="Syncing\u2026">\u22ef</span>';
        }
        return '<tr><td>' + iconHtml + '</td>' + cols.map(function(c){
          var cls = (c === 'status') ? ' class="status-' + f[c] + '"' : '';
          return '<td' + cls + '>' + escapeHtml(f[c] || '') + '</td>';
        }).join('') + '</tr>';
      }).join('')
    + '</tbody></table></div>';

  wrap.innerHTML = html;
}

function resyncAllFailed(){
  var day = _currentDay;
  var jobs = [];
  ORDER.forEach(function(s){
    if (!_currentData[s]) return;
    Object.keys(_currentData[s]).forEach(function(id){
      var e = _currentData[s][id];
      if (e.processed && e.processed.syncedToSheet === false) jobs.push({ rep: s, id: id });
    });
  });
  if (!jobs.length) return;
  toast('Retrying ' + jobs.length + ' sale' + (jobs.length > 1 ? 's' : '') + '\u2026');
  jobs.forEach(function(j){ resyncEntry(j.rep, j.id, null); });
}

function resyncEntry(repSlug, id, linkEl){
  if (linkEl) linkEl.textContent = 'retrying\u2026';
  var day = _currentDay;
  db.ref('salesLog/' + day + '/' + repSlug + '/' + id + '/processed').once('value').then(function(snap){
    var fields = snap.val();
    if (!fields) throw new Error('no processed data found');
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'content-type': 'text/plain' },
      body: JSON.stringify({ action: 'appendSale', secret: APPEND_SECRET, data: Object.assign({}, fields, { entryId: id }) })
    }).then(function(r){ return r.json(); }).then(function(res){
      if (!res || res.ok !== true) throw new Error('sheet push not confirmed');
      return db.ref('salesLog/' + day + '/' + repSlug + '/' + id + '/processed/syncedToSheet').set(true);
    });
  }).then(function(){
    toast('Synced to sheet');
  }).catch(function(){
    db.ref('salesLog/' + day + '/' + repSlug + '/' + id + '/processed/syncedToSheet').set(false);
    toast('Still failing \u2014 check Apps Script');
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
}
function attrEscape(s){
  return String(s).replace(/"/g,'&quot;').replace(/\n/g,'&#10;');
}

var _toastT;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

function copyText(btn){
  var text = btn.getAttribute('data-text');
  navigator.clipboard.writeText(text).then(function(){ toast('Text copied'); })
    .catch(function(){ toast('Copy failed'); });
}

function copyImage(url, btn){
  fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
    return navigator.clipboard.write([ new ClipboardItem({ [blob.type]: blob }) ]);
  }).then(function(){ toast('Image copied'); })
  .catch(function(){ toast('Copy failed \u2014 try "Open full size" and save instead'); });
}

loadDay(todayStr());

/* ── AI extraction: turn each logged entry into a Master-sheet row ── */
/* System prompt and API key both live server-side now, in /api/extract.js */

function extractEntry(entry){
  function callApi(contentBlocks){
    return fetch('/api/extract', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ content: contentBlocks })
    }).then(function(r){
      return r.json().then(function(data){
        if (!r.ok) throw new Error((data && data.error && (data.error.message || data.error)) || ('API ' + r.status));
        return data;
      });
    }).then(function(data){
      var text = data.content.filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('');
      var parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
      if (parsed.error) throw new Error('not a recognizable order');
      return parsed;
    });
  }

  if (entry.type === 'photo' && entry.url){
    return callApi([
      { type:'image', source:{ type:'url', url: entry.url } },
      { type:'text', text: 'Extract the order details.' + (entry.text ? '\n\nAdditional pasted text from the rep:\n' + entry.text : '') }
    ]);
  } else {
    return callApi([{ type:'text', text: 'Extract the order details from this pasted text:\n\n' + (entry.text || '') }]);
  }
}

var _lastResults = []; // rows in Master-sheet column order

document.getElementById('processDay').addEventListener('click', function(){
  var statusEl = document.getElementById('processStatus');
  var resultsWrap = document.getElementById('resultsWrap');

  var day = dayPicker.value;
  var jobs = [];
  ORDER.forEach(function(s){
    if (!_currentData[s]) return;
    Object.keys(_currentData[s]).forEach(function(id){
      var e = _currentData[s][id];
      jobs.push({ rep: s, entry: e });
    });
  });

  if (!jobs.length){ statusEl.textContent = 'Nothing logged this day.'; statusEl.className = 'process-status'; return; }

  resultsWrap.innerHTML = '';
  _lastResults = [];
  var done = 0;

  function runNext(i){
    if (i >= jobs.length){
      statusEl.textContent = 'Done \u2014 ' + jobs.length + ' processed.';
      statusEl.className = 'process-status';
      renderResultsTable();
      return;
    }
    statusEl.textContent = 'Processing ' + (i+1) + ' of ' + jobs.length + '\u2026';
    statusEl.className = 'process-status';
    var job = jobs[i];
    extractEntry(job.entry).then(function(fields){
      _lastResults.push(buildRow(day, job.rep, job.entry, fields, false, null));
      runNext(i+1);
    }).catch(function(err){
      console.error('Extraction failed for entry', job.entry._id, err);
      _lastResults.push(buildRow(day, job.rep, job.entry, {}, true, err.message || String(err)));
      runNext(i+1);
    });
  }
  runNext(0);
});

// Hardcoded plan/price standardization \u2014 the screenshot's own price is never used.
// STANDARD tier speeds are for "NEXT..." plans (including ones prefixed "FiberNEXT").
// FIBER tier speeds are for plans named just "Fiber..." with no "NEXT" in the name.
var STANDARD_PRICES = { 100:37, 200:37, 300:57, 400:57, 500:57, 1000:80 };
var FIBER_PRICES    = { 500:30, 1000:50, 2000:80 };

function standardizePlan(rawPlan){
  if (!rawPlan) return { plan:'', price:'' };
  var speedMatch = rawPlan.match(/(\d{2,4})/);
  if (!speedMatch) return { plan: rawPlan, price:'' };
  var speed = parseInt(speedMatch[1], 10);
  // Check "fiber" FIRST \u2014 real Fiber plans are named "FiberNEXT500" etc, so
  // they also contain "next" and would be misclassified if checked second.
  var isFiber = /fiber/i.test(rawPlan);
  if (isFiber){
    var pf = FIBER_PRICES[speed];
    return { plan: 'Fiber' + speed, price: (pf != null ? pf : '') };
  } else {
    var ps = STANDARD_PRICES[speed];
    return { plan: 'NEXT' + speed, price: (ps != null ? ps : '') };
  }
}

function buildRow(day, repSlug, entry, fields, flagged, errMsg){
  var std = standardizePlan(fields.plan_raw);
  var flagParts = [];
  if (errMsg) flagParts.push(errMsg);
  if (!flagged && fields.flag) flagParts.push(fields.flag);
  if (!flagged && fields.plan_raw && std.price === '') flagParts.push('Unrecognized plan/speed \u2014 set price manually: "' + fields.plan_raw + '"');

  return {
    flagged: flagged,
    errMsg: flagParts.join(' \u2014 '),
    dateSold: day,
    repName: REPS[repSlug],
    accId: fields.account_number || '',
    phone: fields.phone || '',
    customerName: fields.customer_name || '',
    email: fields.email || '',
    address: fields.address || '',
    plan: std.plan,
    price: std.price,
    installDate: fields.install_date || '',
    notes: (entry.notes || '').trim(), // strictly the rep's own typed note \u2014 nothing invented
    status: fields.install_date ? 'Scheduled' : (flagged ? 'Needs review' : 'Pending')
  };
}

function renderResultsTable(){
  var cols = ['dateSold','repName','accId','phone','customerName','email','address','plan','price','installDate','notes','status'];
  var heads = ['Date Sold','Rep Name','Acc ID','Phone','Customer Name','Email','Address','Plan','Price','Install Date','Notes','Status'];

  var html = '<div class="results-scroll"><table class="results-table"><thead><tr>'
    + heads.map(function(h){ return '<th>' + h + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + _lastResults.map(function(row){
        var rowHtml = '<tr>' + cols.map(function(c){
          var cls = (c === 'status') ? ' class="status-' + row[c] + '"' : (row.flagged ? ' class="flag"' : '');
          return '<td' + cls + '>' + escapeHtml(row[c]) + '</td>';
        }).join('') + '</tr>';
        if (row.errMsg){
          var isHardError = row.flagged;
          var label = isHardError ? 'Error: ' : 'Flag: ';
          var color = isHardError ? '#f87171' : '#f5a31a';
          rowHtml += '<tr><td colspan="' + cols.length + '" style="color:' + color + '; font-style:italic; font-size:10.5px; white-space:normal;">' + label + escapeHtml(row.errMsg) + '</td></tr>';
        }
        return rowHtml;
      }).join('')
    + '</tbody></table></div>'
    + '<button class="btn primary" id="copyRows" style="margin-top:12px;">Copy as spreadsheet rows</button>';

  document.getElementById('resultsWrap').innerHTML = html;

  document.getElementById('copyRows').addEventListener('click', function(){
    var cols2 = ['dateSold','repName','accId','phone','customerName','email','address','plan','price','installDate','notes','status'];
    var tsv = _lastResults.map(function(row){
      return cols2.map(function(c){ return String(row[c]).replace(/\t/g,' ').replace(/\n/g,' '); }).join('\t');
    }).join('\n');
    navigator.clipboard.writeText(tsv).then(function(){ toast('Rows copied \u2014 paste into the sheet'); })
      .catch(function(){ toast('Copy failed'); });
  });
}
</script>
</body>
</html>
